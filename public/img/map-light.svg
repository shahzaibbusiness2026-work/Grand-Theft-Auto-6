    <rect x="552" y="506" width="10" height="10"/><rect x="588" y="494" width="10" height="10"/><rect x="624" y="518" width="10" height="10"/>
    <rect x="564" y="542" width="10" height="10"/><rect x="612" y="554" width="10" height="10"/><rect x="540" y="566" width="10" height="10"/>
