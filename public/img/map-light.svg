<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <radialGradient id="ocean" cx=".55" cy=".45" r=".9">
      <stop offset="0" stop-color="#3fa8c9"/><stop offset=".55" stop-color="#2b8fb4"/><stop offset="1" stop-color="#1c76a0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#87ab60"/><stop offset=".5" stop-color="#7a9e54"/><stop offset="1" stop-color="#6b9048"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
