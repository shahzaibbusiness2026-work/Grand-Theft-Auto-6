    <text x="386" y="122" font-size="12" letter-spacing="3.5" opacity=".7">MOUNT KALAGA</text>
    <text x="504" y="342" font-size="14" letter-spacing="3" fill="#0f5a78" text-anchor="middle">LAKE LEONIDA</text>
    <text x="492" y="502" font-size="14" letter-spacing="4" text-anchor="middle" opacity=".85">GRASSRIVERS</text>
    <text x="632" y="368" font-size="13" letter-spacing="2.5" text-anchor="end">PORT GELLHORN</text>
    <text x="590" y="536" font-size="21" letter-spacing="4" text-anchor="middle" fill="#14222b">VICE CITY</text>
    <text x="424" y="692" font-size="12" letter-spacing="3.5" text-anchor="middle" opacity=".8">THE KEYS</text>
    <text x="120" y="560" font-size="12" letter-spacing="4" stroke="#ffffff" stroke-opacity=".4" fill="#0f4a66" opacity=".8">GULF OF MEXICO</text>
    <text x="700" y="230" font-size="12" letter-spacing="4" stroke="#ffffff" stroke-opacity=".4" fill="#0f4a66" opacity=".8">ATLANTIC</text>
