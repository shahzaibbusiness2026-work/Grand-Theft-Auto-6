    <clipPath id="cityClip"><rect x="528" y="458" width="126" height="146" rx="8"/></clipPath>
    <clipPath id="wetClip">
      <path d="M424 430q44-20 96-8 52 12 62 48 9 36-20 64-32 30-86 27-54-3-70-42-14-37 18-89Z"/>
    </clipPath>
