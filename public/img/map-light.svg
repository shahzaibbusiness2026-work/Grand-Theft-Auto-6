  <g fill="none" stroke="#e2dcc8" stroke-width="1.6" opacity=".7" stroke-linecap="round">
    <path d="M398 300c52 12 102 20 162 16 40-4 70-16 96-28"/>
    <path d="M416 208c48 8 96 6 144-6 42-10 78-26 108-44"/>
    <path d="M428 470c44 10 88 26 122 52"/>
    <path d="M470 120c30 34 44 78 48 124"/>
    <path d="M598 200c8 46 4 92-10 136"/>
