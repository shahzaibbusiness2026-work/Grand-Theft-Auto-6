    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d0fe"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="400" fill="url(#night)"/>
  <circle cx="90" cy="70" r="2" fill="#fff"/><circle cx="180" cy="40" r="1.6" fill="#fff"/><circle cx="520" cy="60" r="2" fill="#fff"/><circle cx="600" cy="120" r="1.4" fill="#fff"/><circle cx="420" cy="30" r="1.6" fill="#fff"/>
